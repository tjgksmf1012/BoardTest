# Render.com 배포 블루프린트 (무료 웹 서비스)
# 사용법: render.com 로그인 → New → Blueprint → 이 저장소 선택 → Apply
services:
  - type: web
    name: pointlounge
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /board
    envVars:
      # Node를 고정한다. 기본값(최신판)은 better-sqlite3 미리빌드 바이너리가 없어 컴파일이 깨지고,
      # 22.12.0 미만은 CommonJS에서 ESM 모듈을 require 할 수 없어
      # sanitize-html → htmlparser2(ESM 전용) 불러오기에서 서버가 뜨자마자 죽는다.
      - key: NODE_VERSION
        value: 22.22.2
      - key: NODE_ENV
        value: production
      # 링크 공유 미리보기(og:)에 쓸 실제 주소. 없으면 요청 정보로 만들어 쓴다.
      - key: SITE_URL
        value: https://pointlounge.onrender.com
      - key: SESSION_SECRET
        generateValue: true   # Render가 안전한 랜덤 값 자동 생성
      - key: TZ
        value: Asia/Seoul
