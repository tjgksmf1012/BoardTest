# Render.com 배포 블루프린트 (무료 웹 서비스)
# 사용법: render.com 로그인 → New → Blueprint → 이 저장소 선택 → Apply
services:
  - type: web
    name: pointlounge
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /board
    envVars:
      # Node를 안정 LTS로 고정 (기본값은 최신판을 물어와 better-sqlite3 미리빌드 바이너리가 없어 컴파일이 깨진다)
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true   # Render가 안전한 랜덤 값 자동 생성
      - key: TZ
        value: Asia/Seoul
