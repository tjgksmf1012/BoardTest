<script>
(function () {
  var editor = document.getElementById('editor');
  var form = document.getElementById('write-form');
  var contentInput = document.getElementById('content-input');
  var photoInput = document.getElementById('photo-input');
  var MAX = 5000;
  var MAX_IMAGES = 5;

  // Enter로 줄을 바꿀 때 <div> 대신 <p>가 생기도록 (서버 허용 태그와 맞춤)
  try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}

  window.counter = function (len, id, max) {
    document.getElementById(id).textContent = len + ' / ' + max.toLocaleString();
  };

  function textLength() {
    return (editor.innerText || '').replace(/\s+/g, ' ').trim().length;
  }
  function updateCount() {
    var n = textLength();
    var el = document.getElementById('content-count');
    el.textContent = n.toLocaleString() + ' / 5,000';
    el.classList.toggle('over', n > MAX);
    editor.classList.toggle('is-empty', !editor.textContent.trim() && !editor.querySelector('img'));
  }

  // ---- 커서 위치 기억 (사진 버튼을 누르면 포커스가 잠깐 떠나기 때문) ----
  var savedRange = null;
  function saveRange() {
    var sel = window.getSelection();
    if (sel && sel.rangeCount && editor.contains(sel.anchorNode)) savedRange = sel.getRangeAt(0);
  }
  function restoreRange() {
    editor.focus();
    if (!savedRange) return;
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }
  document.addEventListener('selectionchange', function () {
    if (document.activeElement === editor) { saveRange(); syncToolbar(); }
  });

  // ---- 서식 버튼 ----
  function exec(cmd, value) {
    restoreRange();
    document.execCommand(cmd, false, value || null);
    saveRange();
    updateCount();
    syncToolbar();
  }
  document.querySelectorAll('.tb-btn[data-cmd]').forEach(function (btn) {
    // mousedown/touchstart에서 막아야 에디터의 선택 영역이 유지된다
    btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
    btn.addEventListener('click', function () { exec(btn.dataset.cmd); });
  });
  document.querySelectorAll('.tb-btn[data-block]').forEach(function (btn) {
    btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
    btn.addEventListener('click', function () { exec('formatBlock', '<' + btn.dataset.block + '>'); });
  });

  // 현재 커서 위치의 서식을 버튼에 표시
  function syncToolbar() {
    document.querySelectorAll('.tb-btn[data-cmd]').forEach(function (b) {
      var on = false;
      try { on = document.queryCommandState(b.dataset.cmd); } catch (e) {}
      b.classList.toggle('on', !!on);
    });
    var block = '';
    try { block = (document.queryCommandValue('formatBlock') || '').toLowerCase(); } catch (e) {}
    document.querySelectorAll('.tb-btn[data-block]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.block === block);
    });
  }

  // ---- 사진 첨부 (본문과 따로) ----
  //
  // 예전에는 커서 자리에 <img> 를 밀어 넣었다. 모바일에서 커서를 원하는 자리에
  // 두기가 어렵고, 넘겨받는 쪽에서 본문 HTML 을 뒤져야 해서 첨부칸으로 바꿨다.
  var attachAdd = document.getElementById('attachAdd');
  var attachList = document.getElementById('attachList');
  var attachCount = document.getElementById('attachCount');
  var attachTip = document.getElementById('attachTip');
  var attachDrop = document.getElementById('attachDrop');
  var imagesInput = document.getElementById('images-input');
  var files = imagesInput.value ? imagesInput.value.split(',').filter(Boolean) : [];

  function draw() {
    attachList.innerHTML = '';
    files.forEach(function (name, i) {
      var li = document.createElement('li');
      li.className = 'attach-item';
      li.draggable = true;
      li.dataset.index = String(i);
      li.innerHTML = '<img src="../img/uploads/' + encodeURIComponent(name) + '" alt="첨부 사진 ' + (i + 1) + '">'
        + '<button type="button" class="attach-x" aria-label="' + (i + 1) + '번째 사진 빼기">×</button>';
      li.querySelector('.attach-x').addEventListener('click', function () {
        files.splice(i, 1); sync();
      });
      attachList.appendChild(li);
    });
    sync(true);
  }
  function sync(skipDraw) {
    imagesInput.value = files.join(',');
    attachCount.textContent = files.length + ' / ' + MAX_IMAGES;
    attachDrop.hidden = files.length >= MAX_IMAGES;
    attachTip.hidden = files.length < 2;
    if (!skipDraw) draw();
  }

  attachAdd.addEventListener('click', function () { photoInput.click(); });

  photoInput.addEventListener('change', function () {
    var chosen = Array.prototype.slice.call(photoInput.files || []);
    photoInput.value = '';                       // 같은 파일을 다시 골라도 동작하게
    if (!chosen.length) return;
    if (files.length + chosen.length > MAX_IMAGES) {
      alert('사진은 최대 ' + MAX_IMAGES + '장까지 붙일 수 있어요.');
      chosen = chosen.slice(0, MAX_IMAGES - files.length);
      if (!chosen.length) return;
    }
    var tooBig = chosen.filter(function (f) { return f.size > 10 * 1024 * 1024; });
    if (tooBig.length) { alert('사진은 장당 10MB까지 올릴 수 있어요.'); return; }

    attachAdd.disabled = true;
    attachAdd.classList.add('loading');
    // 고른 순서대로 붙도록 하나씩 차례로 올린다
    chosen.reduce(function (chain, file) {
      return chain.then(function () {
        var data = new FormData();
        data.append('image', file);
        return fetch('/board/upload-image', {
          method: 'POST', body: data, credentials: 'same-origin',
          headers: { 'X-CSRF-Token': 'Q7MErdnne4RvFol-ojhzz7EznRVO-ydg' },
        })
          .then(function (r) { return r.json().then(function (j) { return r.ok ? j : Promise.reject(j); }); })
          .then(function (j) { files.push(j.url.split('/').pop()); sync(); });
      });
    }, Promise.resolve())
      .catch(function (e) { alert((e && e.error) || '사진을 올리지 못했어요. 잠시 후 다시 시도해주세요.'); })
      .finally(function () { attachAdd.disabled = false; attachAdd.classList.remove('loading'); });
  });

  // 끌어서 순서 바꾸기
  var dragFrom = null;
  attachList.addEventListener('dragstart', function (e) {
    var li = e.target.closest('.attach-item');
    if (!li) return;
    dragFrom = Number(li.dataset.index);
    li.classList.add('dragging');
  });
  attachList.addEventListener('dragover', function (e) { e.preventDefault(); });
  attachList.addEventListener('drop', function (e) {
    e.preventDefault();
    var li = e.target.closest('.attach-item');
    if (!li || dragFrom === null) return;
    var to = Number(li.dataset.index);
    if (to === dragFrom) return;
    files.splice(to, 0, files.splice(dragFrom, 1)[0]);
    dragFrom = null;
    sync();
  });
  attachList.addEventListener('dragend', function () {
    dragFrom = null;
    attachList.querySelectorAll('.dragging').forEach(function (n) { n.classList.remove('dragging'); });
  });

  draw();

  // ---- 붙여넣기는 글자만 (다른 사이트 서식이 딸려와 깨지는 것 방지) ----
  editor.addEventListener('paste', function (e) {
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });

  editor.addEventListener('input', function () { updateCount(); });
  editor.addEventListener('focus', saveRange);

  // ---- 전송 ----
  form.addEventListener('submit', function (e) {
    if (!textLength() && files.length === 0) {
      e.preventDefault();
      alert('내용을 입력해주세요.');
      editor.focus();
      return;
    }
    if (textLength() > MAX) {
      e.preventDefault();
      alert('내용은 5,000자 이내로 입력해주세요.');
      return;
    }
    contentInput.value = editor.innerHTML;
  });

  updateCount();
  
})();
</script>

  <script>
    // 화면 테마 전환: 밝게 ↔ 어둡게. 고른 값은 기기에 저장해 다음에도 유지된다.
    (function () {
      var btn = document.getElementById('themeBtn');
      if (!btn) return;
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      function isDark() {
        var t = document.documentElement.getAttribute('data-theme');
        return t ? t === 'dark' : mq.matches;
      }
      function label() {
        btn.title = btn.setAttribute('aria-label', isDark() ? '밝은 화면으로 바꾸기' : '어두운 화면으로 바꾸기');
        btn.title = isDark() ? '밝은 화면으로 바꾸기' : '어두운 화면으로 바꾸기';
      }
      btn.addEventListener('click', function () {
        var next = isDark() ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('pl-theme', next); } catch (e) {}
        label();
      });
      // 직접 고른 적이 없으면 기기 설정이 바뀔 때 따라간다
      mq.addEventListener('change', label);
      label();
    })();
  </script>

  <script>
    // 점 3개(더보기) 메뉴 — 글·댓글마다 하나씩 있어서 각각에 거는 대신
    // 문서 전체에서 클릭을 한 번만 받아 처리한다.
    (function () {
      function closeAll(except) {
        document.querySelectorAll('.menu-pop').forEach(function (pop) {
          if (pop === except) return;
          pop.hidden = true;
          var btn = pop.parentNode.querySelector('.menu-btn');
          if (btn) btn.setAttribute('aria-expanded', 'false');
        });
      }
      document.addEventListener('click', function (e) {
        var btn = e.target.closest && e.target.closest('.menu-btn');
        if (btn) {
          var pop = btn.parentNode.querySelector('.menu-pop');
          var opening = pop.hidden;
          closeAll(pop);
          pop.hidden = !opening;
          btn.setAttribute('aria-expanded', opening ? 'true' : 'false');
          if (opening) {
            // 화면 오른쪽으로 삐져나가면 왼쪽으로 붙인다
            pop.style.right = '0';
            pop.style.left = 'auto';
            var r = pop.getBoundingClientRect();
            if (r.left < 4) { pop.style.right = 'auto'; pop.style.left = '0'; }
          }
          return;
        }
        // 메뉴 안을 누른 게 아니면 닫는다
        if (!(e.target.closest && e.target.closest('.menu-pop'))) closeAll(null);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        var open = document.querySelector('.menu-pop:not([hidden])');
        if (!open) return;
        var btn = open.parentNode.querySelector('.menu-btn');
        closeAll(null);
        if (btn) btn.focus();
      });
    })();
  </script>

  <script>
    // 필수 입력 안내 문구를 한글로 (브라우저 기본 영어 메시지 대체)
    document.querySelectorAll('input[required], textarea[required]').forEach(function (el) {
      el.addEventListener('invalid', function () {
        if (!el.value) el.setCustomValidity('이 항목을 입력해주세요.');
      });
      el.addEventListener('input', function () { el.setCustomValidity(''); });
    });
  </script>

  <button class="to-top" id="toTop" type="button" aria-label="맨 위로" hidden=""><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M6 11l6-6 6 6"></path></svg></button>
  <script>
    (function () {
      var btn = document.getElementById('toTop');
      if (!btn) return;
      function toggle() { btn.hidden = window.scrollY < 500; }
      window.addEventListener('scroll', toggle, { passive: true });
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      btn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); });
      toggle();
    })();
  </script>


  <script>
  // 새 알림을 실시간으로 받아 종에 숫자를 올린다.
  //
  // 서버(/notifications/stream)는 진작 있었는데 브라우저에서 붙는 코드가 없어,
  // 새로고침해야만 알림이 보이고 있었다.
  //
  // EventSource 를 못 쓰는 환경(구형 브라우저, 중간 서버가 스트림을 모아두는 경우)도
  // 있어서, 몇 번 끊기면 60초마다 개수만 물어보는 쪽으로 갈아탄다.
  (function () {
    var badge = document.getElementById('bellBadge');
    if (!badge) return;

    function setCount(n) {
      n = Number(n) || 0;
      badge.textContent = n > 99 ? '99+' : String(n);
      badge.hidden = n <= 0;
    }
    function say(text, link) {
      var t = document.createElement('a');
      t.className = 'toast toast-notify';
      t.href = link || '/notifications';
      t.textContent = text;
      document.body.appendChild(t);
      setTimeout(function () { t.classList.add('hide'); }, 4000);
      setTimeout(function () { t.remove(); }, 4600);
    }

    var polling = null;
    function startPolling() {
      if (polling) return;
      polling = setInterval(function () {
        fetch('/notifications/count', { credentials: 'same-origin' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) { if (d) setCount(d.unread); })
          .catch(function () {});
      }, 60000);
    }

    if (!window.EventSource) { startPolling(); return; }

    var fails = 0;
    var es = new EventSource('/notifications/stream');
    es.addEventListener('ready', function (e) {
      fails = 0;
      try { setCount(JSON.parse(e.data).unread); } catch (err) {}
    });
    // 서버는 이름 붙은 이벤트(event: notify)로 보낸다.
    // onmessage 는 이름 없는 것만 받으므로 이름으로 듣는다.
    function onNotify(e) {
      try {
        var d = JSON.parse(e.data);
        setCount(d.unread);
        if (d.message) say(d.message, d.link);
      } catch (err) {}
    }
    es.addEventListener('notify', onNotify);
    es.onmessage = onNotify;   // 이름 없이 보내도 놓치지 않게
    es.onerror = function () {
      // 브라우저가 알아서 다시 붙지만, 계속 실패하면 물어보는 쪽으로 바꾼다
      if (++fails >= 4) { es.close(); startPolling(); }
    };
    window.addEventListener('pagehide', function () { es.close(); });
  })();
  </script>
